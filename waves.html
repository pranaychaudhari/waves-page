<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimized Waves</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="waveCanvas"></canvas>
    <script>
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Optimization: Set pixel density for high-resolution displays
        const pixelDensity = Math.min(window.devicePixelRatio, 2);
        canvas.width *= pixelDensity;
        canvas.height *= pixelDensity;
        ctx.scale(pixelDensity, pixelDensity);

        let waves = [];
        let waveFrequency = 50;
        let waveAmplitude = 20;

        function createWaves() {
            const now = new Date();
            waves = [];
            for (let i = 0; i < canvas.width; i += waveFrequency) {
                waves.push({
                    x: i,
                    y: canvas.height / 2 + Math.sin(i / 100 + now.getTime() / 500) * waveAmplitude
                });
            }
        }

        function drawWaves() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#007BFF';
            ctx.beginPath();
            for (let wave of waves) {
                ctx.lineTo(wave.x, wave.y);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.closePath();
            ctx.fill();
        }

        function update() {
            createWaves();
            drawWaves();
            // Using larger intervals for reducing lag
            requestAnimationFrame(update);
        }

        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            createWaves();
        });

        update();
    </script>
</body>
</html>
