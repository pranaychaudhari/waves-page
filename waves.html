<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypnotic Interactive Waves</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body class="bg-black">
    <div class="absolute top-4 left-4 text-white text-lg font-sans z-10">
        Move your mouse to interact with the waves!
    </div>
    <script>
        function setup() {
            createCanvas(windowWidth, windowHeight);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        function draw() {
            background(0);
            let time = millis() * 0.001;
            let mouseEffect = map(mouseX, 0, width, 0.5, 2.0);
            let waveHeight = height * 0.1;

            for (let y = 0; y < height; y += 10) {
                beginShape();
                for (let x = 0; x <= width; x += 10) {
                    let waveOffset = sin(x * 0.01 + y * 0.02 + time) * waveHeight * mouseEffect;
                    let r = map(sin(x * 0.01 + time), -1, 1, 100, 255);
                    let g = map(sin(y * 0.02 + time), -1, 1, 100, 255);
                    let b = map(cos(x * 0.01 + y * 0.02 + time), -1, 1, 100, 255);
                    stroke(r, g, b);
                    noFill();
                    vertex(x, y + waveOffset);
                }
                endShape();
            }
        }
    </script>
</body>
</html>
